[project]
name = "sleeper-tui"
version = "0.1.0"
description = "Terminal UI for Sleeper fantasy football lineups and matchups"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "textual>=3.0",
]

[project.scripts]
sleeper-tui = "sleeper_tui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel.force-include]
"src/sleeper_tui/app.tcss" = "sleeper_tui/app.tcss"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
